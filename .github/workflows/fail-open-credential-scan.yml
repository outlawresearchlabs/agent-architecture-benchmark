name: fail-open-credential-scan
# Layer 1 of the fail-open-credential prevention strategy. Catches the
# recurring footgun pattern that's bitten outlaw-run#7 (S3), outlaw-run#8
# (live PG credential), and agent-architecture-benchmark#1 (same live PG
# credential, public-repo exposure). See agent-coordination tracking issue
# for the full plan + roadmap.
#
# The pattern: os.environ.get(KEY, "<hardcoded-default-that-looks-secret-ish>")
# or process.env.KEY || / ?? "<...>" with high-entropy hex / DSN / known
# token prefixes (sk_, ghp_, AKIA*, eyJ, postgres://, etc.).
#
# Allowlist: lines containing `failopen-allow:<reason>` are skipped — for
# genuinely-public client-side values like Stripe pk_live, Algolia search
# keys, etc. Use sparingly and document the reason inline.

# Cost control (agent-coordination#30): paths match the scan's own --include
# globs below, so skipping a PR that touches none of them loses zero coverage
# (there'd be nothing to grep). Keep this a NON-required check — a path-skip
# leaves a required check pending forever and would block the PR.
on:
  pull_request:
    paths: &scan_paths
      - '**/*.py'
      - '**/*.sh'
      - '**/*.ts'
      - '**/*.tsx'
      - '**/*.js'
      - '**/*.jsx'
  push:
    branches: [main]
    paths: *scan_paths

# Cancel superseded runs on rapid pushes to the same ref — the dominant
# free-tier-minute driver (agent-coordination#30 cost analysis).
concurrency:
  group: failopen-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: scan for fail-open credential defaults
        run: |
          set +e  # grep returns 1 on no-match; we handle that manually

          PY='os\.environ\.get\([^)]+,\s*['\''"]([a-fA-F0-9]{16,}|sk_(live|test)_[A-Za-z0-9]|pk_live_[A-Za-z0-9]|ghp_[A-Za-z0-9]|gho_[A-Za-z0-9]|AKIA[0-9A-Z]{16}|eyJ[A-Za-z0-9_-]{10}|postgres(ql)?://[^@]+:[^@]+@|mysql://[^@]+:[^@]+@|mongodb://[^@]+:[^@]+@)'
          JS='process\.env\.[A-Z_]+\s*(\|\||\?\?)\s*['\''"]([a-fA-F0-9]{16,}|sk_(live|test)_|pk_live_|ghp_|gho_|AKIA[0-9A-Z]{16}|eyJ[A-Za-z0-9_-]{10}|postgres(ql)?://[^@]+:[^@]+@|mysql://[^@]+:[^@]+@|mongodb://[^@]+:[^@]+@)'

          hits=$( ( grep -rnE "$PY" --include='*.py' --include='*.sh' . 2>/dev/null ; \
                    grep -rnE "$JS" --include='*.ts' --include='*.js' --include='*.tsx' --include='*.jsx' . 2>/dev/null ) | \
                  grep -v '/node_modules/' | \
                  grep -v 'failopen-allow:' )

          if [ -n "$hits" ]; then
            echo "::error::Fail-open credential default detected (hardcoded secret-shape value as os.environ.get / process.env default)."
            echo ""
            echo "$hits"
            echo ""
            echo "::error::Convert to fail-closed pattern:"
            echo "  Python:  try: X = os.environ['KEY'] ; except KeyError: raise RuntimeError(...)"
            echo "  TS/JS:   const X = process.env.KEY; if (!X) throw new Error(...)"
            echo ""
            echo "If this is genuinely a public client-side value (Stripe pk_live, Algolia search-only key,"
            echo "etc.), add a line-end comment 'failopen-allow:<reason>' to whitelist with rationale."
            exit 1
          fi

          echo "✓ no fail-open credential patterns detected"
